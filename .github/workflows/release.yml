# Build click-to-install desktop packages for every supported OS/arch.
# Pack runs without credentials on every pull request, master push, and
# dsh-v* tag, so a change proves the installers still build. A tag push or
# a manual dispatch with publish=true attaches those installers to a GitHub
# Release. This workflow does not pack or publish npm tarballs.
name: Release (dsh)

on:
  pull_request:
  push:
    branches: [master]
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the installers to a GitHub Release. Must run from a dsh-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  pack:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: --mac dmg --arm64
            artifact: desktop-mac-arm64
            node_arch: arm64
          - os: macos-15
            target: --mac dmg --x64
            artifact: desktop-mac-x64
            node_arch: x64
          - os: windows-latest
            target: --win nsis --x64
            artifact: desktop-win-x64
            node_arch: x64
          - os: ubuntu-24.04
            target: --linux AppImage --x64
            artifact: desktop-linux-x64
            node_arch: x64
          - os: ubuntu-24.04-arm
            target: --linux AppImage --arm64
            artifact: desktop-linux-arm64
            node_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.node_arch }}-37.2.6

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:verify --family dsh

      - name: Build
        run: pnpm run build

      - name: Stage harness runtime
        env:
          DSH_DESKTOP_NODE_ARCH: ${{ matrix.node_arch }}
        run: pnpm exec tsx scripts/stage-desktop-runtime.ts

      - name: Pack installer
        env:
          DSH_DESKTOP_NODE_ARCH: ${{ matrix.node_arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: ./apps/desktop/node_modules/.bin/electron-builder --project apps/desktop --publish never ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach installers to GitHub Release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsh-v'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require a dsh-v* tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/dsh-v*) ;;
            *)
              echo "::error::Attaching installers requires a dsh-v* tag, got ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Keep only click-to-install packages
        run: |
          set -euo pipefail
          find dist -type f ! \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) -delete
          find dist -type d -empty -delete
          count=$(find dist -type f | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || {
            echo "::error::No installer files downloaded"
            exit 1
          }
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
